<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>صفحتي الأولى</title>
    <style>
        body {
            background-color: #eef2f3;
            font-family: "Tahoma";
            text-align: center;
            padding-top: 50px;
        }
        h1 {
            color: #0078d7;
        }
        p {
            color: #333;
            font-size: 18px;
        }
        button {
            background-color: #0078d7;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #005bb5;
        }
    </style>
</head>
<body>
    <h1>مرحباً بك في موقعي 🌐</h1>
    <p>أنا أنشأت هذه الصفحة لأول مرة !</p>
    <button onclick="alert('شكراً على زيارتك!')">اضغط هنا</button>
</body>
</html>
